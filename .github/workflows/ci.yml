name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra xtquant

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Code health
        run: uv run python scripts/check_code_health.py --enforce

      - name: Unit tests
        run: uv run python -m unittest discover
