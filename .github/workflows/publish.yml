name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build package
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check tag matches package version
        shell: python
        run: |
          import os
          import sys
          import tomllib
          from pathlib import Path

          ref_name = os.environ["GITHUB_REF_NAME"]
          tag_version = ref_name[1:] if ref_name.startswith("v") else ref_name
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = pyproject["project"]["version"]
          if tag_version != package_version:
              print(
                  f"Tag version {tag_version!r} does not match "
                  f"pyproject.toml version {package_version!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"Publishing qmtserver {package_version}")

      - name: Install dependencies
        run: uv sync --extra xtquant

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run python -m unittest discover

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv tool run twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
