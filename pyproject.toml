[project]
name = "qmtserver"
version = "0.6.0"
description = "Windows MiniQMT gateway server."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "gly11" },
]
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.48.0",
    "websockets>=15.0.1",
]

keywords = ["miniqmt", "qmt", "xtquant", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.optional-dependencies]
xtquant = [
    "xtquant>=250516.1.1,<260000",
]

[project.urls]
Homepage = "https://github.com/gly11/qmtserver"
Repository = "https://github.com/gly11/qmtserver"
Issues = "https://github.com/gly11/qmtserver/issues"
Documentation = "https://github.com/gly11/qmtserver/tree/main/docs"

[project.scripts]
qmtserver = "qmtserver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmtserver"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
root = ["./src", "."]
python = ".venv"
python-version = "3.12"
python-platform = "win32"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
