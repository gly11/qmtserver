[project]
name = "qmtserver"
version = "0.1.0"
description = "MiniQMT bridge and connectivity checker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.48.0",
    "websockets>=15.0.1",
]
keywords = ["miniqmt", "qmt", "xtquant", "trading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
qmtserver = "qmtserver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmtserver"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
root = ["./src", "."]
python = ".venv"
python-version = "3.13"
python-platform = "win32"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
